name: Actualizar CINS Army

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y validar IPv4 públicas
        run: |
          curl -sS --fail --max-time 30 --max-filesize 10485760 https://cinsscore.com/list/ci-badguys.txt > temp_raw.txt
          python3 - << 'EOF'
          import ipaddress
          import sys

          ips_validas = set()
          with open("temp_raw.txt", "r", encoding="utf-8", errors="ignore") as f:
              for linea in f:
                  dato = linea.strip().split("#")[0].strip()
                  if not dato:
                      continue
                  try:
                      red = ipaddress.IPv4Network(dato, strict=False)
                      if red.is_global and red.prefixlen >= 16:
                          ips_validas.add(str(red.network_address) if red.prefixlen == 32 else str(red))
                  except ValueError:
                      continue

          if not ips_validas:
              sys.exit(1)

          lista_ordenada = sorted(ips_validas)[:100000]
          with open("cins_army.txt", "w", encoding="ascii") as out:
              out.write("\n".join(lista_ordenada) + "\n")
          print(f"Éxito: {len(lista_ordenada)} IPs guardadas.")
          EOF
          rm -f temp_raw.txt

      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cins_army.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización CINS Army" && git push)
